name: Build ECU Mems Manager (Windows)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    name: Build Windows (MSVC)
    runs-on: windows-latest

    steps:
    # 1. Récupération du code source
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Installation des bibliothèques Qt 5
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    # 3. Configuration des outils de compilation Microsoft (MSVC)
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    # 4. Configuration avec CMake
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    # 5. Compilation du projet
    - name: Build Application
      run: cmake --build build --config Release

    # 6. Déploiement des DLLs Qt à côté de l'exécutable (.exe)
    - name: Deploy Qt DLLs
      run: |
        windeployqt build/Release/ecu_mems_manager.exe

    # 7. Sauvegarde du résultat téléchargeable sur GitHub
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ECU-Mems-Manager-Windows
        path: build/Release/
