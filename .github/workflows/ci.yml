name: Build and Test Mems-Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-linux:
    name: Build sur Ubuntu / Linux
    runs-on: ubuntu-latest

    steps:
    # 1. Récupération du code source
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Installation de C++ et des dépendances Qt
    - name: Install Build Dependencies & Qt
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          qtbase5-dev \
          qtchooser \
          qt5-qmake \
          qtbase5-dev-tools

    # 3. Configuration avec CMake
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    # 4. Compilation du projet
    - name: Build Application
      run: cmake --build build --config Release

    # 5. Stockage des fichiers exécutables compilés
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mems-scan-linux-build
        path: build/
