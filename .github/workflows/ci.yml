name: Build Mems-Scan (Windows)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    name: Build sur Windows
    runs-on: windows-latest

    steps:
    # 1. Récupération du code source
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Installation de Qt pour Windows (MSVC)
    - name: Install Qt
      uses: jurplel/install-qt@v3
      with:
        version: '5.15.2' # Modifiez si votre projet utilise Qt6 (ex: '6.5.0')
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    # 3. Configuration de l'environnement MSVC (compilateur C++)
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    # 4. Configuration avec CMake
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    # 5. Compilation du projet
    - name: Build Application
      run: cmake --build build --config Release

    # 6. Déploiement des DLLs Qt (windeployqt)
    # Nécessaire pour que le .exe fonctionne en double-cliquant dessus
    - name: Deploy Qt Libraries
      run: |
        windeployqt build/Release/

    # 7. Sauvegarde de l'exécutable et des DLLs
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mems-scan-windows
        path: build/Release/
