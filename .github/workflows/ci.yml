name: Build ECU Mems Manager (Windows)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    name: Build Windows (MSVC)
    runs-on: windows-latest

    steps:
    # 1. Récupération du code source
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Installation des bibliothèques Qt 5
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    # 3. Configuration des outils de compilation Microsoft (MSVC)
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    # 4. Cloner et compiler librosco
    - name: Download and Build librosco
      run: |
        git clone https://github.com/ColinBourge/librosco.git librosco_src
        cmake -B librosco_src/build -S librosco_src -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/rosco_install"
        cmake --build librosco_src/build --config Release
        cmake --install librosco_src/build --config Release

    # 5. Configuration de ton projet principal avec CMake
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/rosco_install"

    # 6. Compilation de ton projet principal
    - name: Build Application
      run: cmake --build build --config Release

    # 7. Déploiement des DLLs Qt ET copie de la DLL librosco
    - name: Deploy Qt DLLs and librosco
      run: |
        windeployqt build/Release/ecu_mems_manager.exe
        Copy-Item -Path "${{ github.workspace }}/rosco_install/bin/librosco.dll" -Destination "build/Release/" -ErrorAction SilentlyContinue
        Copy-Item -Path "${{ github.workspace }}/rosco_install/bin/rosco.dll" -Destination "build/Release/" -ErrorAction SilentlyContinue

    # 8. Sauvegarde de l'exécutable et des DLLs pour le téléchargement
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ECU-Mems-Manager-Windows
        path: build/Release/
